context: |
  SaaS e-commerce monorepo (Turborepo + pnpm) with 3 Next.js apps (storefront, admin, superadmin)
  and 7 shared packages (@repo/db, @repo/auth, @repo/commerce, @repo/storage, @repo/logger,
  @repo/validation, @repo/test-utils). Multi-tenant by column (tenantId), RLS on all business tables.
  Drizzle ORM + PostgreSQL (Neon), NextAuth v5 JWT, MercadoPago webhooks. Strict TypeScript,
  Zod validation, Tailwind CSS. All artifacts in English.

strict_tdd: true

testing:
  workspace_command: "pnpm test"
  coverage_command: "pnpm test --coverage"
  e2e_command: "pnpm test:e2e"
  projects:
    - path: "apps/storefront"
      stack: "Next.js 16 (App Router, React 19, TypeScript)"
      test_command: "pnpm test"
      framework: "vitest"
      layers:
        unit: true
        integration: true
        e2e: false
      quality:
        lint: "pnpm lint"
        typecheck: "pnpm typecheck"
        format: "pnpm format:check"
    - path: "apps/admin"
