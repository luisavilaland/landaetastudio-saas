name: E2E Tests

on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/storefront/**"
      - "apps/admin/**"
      - "apps/superadmin/**"
      - "packages/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  E2E_STOREFRONT_URL: https://tienda1.landaetastudio.com
  E2E_STOREFRONT_T2_URL: https://tienda2.landaetastudio.com
  E2E_ADMIN_URL: https://admin.landaetastudio.com
  E2E_SUPERADMIN_URL: https://superadmin.landaetastudio.com
  E2E_WEBHOOK_TEST: "1"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Guard anti-fork: este repo es público y usa un runner self-hosted.
# Bloqueamos que código de PRs de entornos ajenos (forks) se ejecute en la
# máquina del runner self-hosted (vector RCE). push/workflow_dispatch y PRs
# del mismo repo corren normal; los PRs de forks se saltan.
jobs:
  wait-for-deployments:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Wait for storefront to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$E2E_STOREFRONT_URL"; then
              echo "Storefront ready"
              exit 0
            fi
            sleep 10
          done
          echo "Storefront not ready after 10 minutes"
          exit 1
        env:
          E2E_STOREFRONT_URL: ${{ env.E2E_STOREFRONT_URL }}
      - name: Wait for admin to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$E2E_ADMIN_URL"; then
              echo "Admin ready"
              exit 0
            fi
            sleep 10
          done
          echo "Admin not ready after 10 minutes"
          exit 1
        env:
          E2E_ADMIN_URL: ${{ env.E2E_ADMIN_URL }}
      - name: Wait for superadmin to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$E2E_SUPERADMIN_URL"; then
              echo "Superadmin ready"
              exit 0
            fi
            sleep 10
          done
          echo "Superadmin not ready after 10 minutes"
          exit 1
        env:
          E2E_SUPERADMIN_URL: ${{ env.E2E_SUPERADMIN_URL }}

  seed:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    needs: [wait-for-deployments, seed]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        # Sin --with-deps: en AlmaLinux Playwright cae al fallback Ubuntu y usa apt-get (inexistente).
        # Las libs del sistema se instalan una vez en el runner vía dnf; Playwright 1.62 ya tiene
        # el build chromium-1234 cacheado en el runner y `install chromium` valida sin descargar.
        run: pnpm exec playwright install chromium
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const outcome = '${{ needs.e2e.result }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const body = outcome === 'success'
              ? `✅ **E2E Tests passed** — [View run](${runUrl})`
              : `❌ **E2E Tests failed** — [View run](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('E2E Tests'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
