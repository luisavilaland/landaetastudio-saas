name: E2E Tests

on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/storefront/**'
      - 'apps/admin/**'
      - 'apps/superadmin/**'
      - 'packages/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  E2E_STOREFRONT_URL: https://tienda1.landaetastudio.com
  E2E_STOREFRONT_T2_URL: https://tienda2.landaetastudio.com
  E2E_ADMIN_URL: https://admin.landaetastudio.com
  E2E_SUPERADMIN_URL: https://superadmin.landaetastudio.com
  E2E_WEBHOOK_TEST: '1'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Guard anti-fork: este repo es público y usa un runner self-hosted.
# Bloqueamos que código de PRs de entornos ajenos (forks) se ejecute en la
# máquina del runner self-hosted (vector RCE). push/workflow_dispatch y PRs
# del mismo repo corren normal; los PRs de forks se saltan.
jobs:
  wait-for-deployments:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for storefront to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$E2E_STOREFRONT_URL"; then
              echo "Storefront ready"
              exit 0
            fi
            sleep 10
          done
          echo "Storefront not ready after 10 minutes"
          exit 1
        env:
          E2E_STOREFRONT_URL: ${{ env.E2E_STOREFRONT_URL }}
      - name: Wait for admin to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$E2E_ADMIN_URL"; then
              echo "Admin ready"
              exit 0
            fi
            sleep 10
          done
          echo "Admin not ready after 10 minutes"
          exit 1
        env:
          E2E_ADMIN_URL: ${{ env.E2E_ADMIN_URL }}
      - name: Wait for superadmin to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$E2E_SUPERADMIN_URL"; then
              echo "Superadmin ready"
              exit 0
            fi
            sleep 10
          done
          echo "Superadmin not ready after 10 minutes"
          exit 1
        env:
          E2E_SUPERADMIN_URL: ${{ env.E2E_SUPERADMIN_URL }}

  seed:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar conexion a Neon (con SSL)
        run: |
          node -e "
            const p = require('postgres');
            const s = p(process.env.DATABASE_URL, { connect_timeout: 10000, ssl: 'require' });
            s\`SELECT 1 AS ok\`.then(([r]) => {
              console.log('CONEXION OK:', r.ok);
              return s.end();
            }).catch(e => {
              console.log('ERROR CONEXION:', e.code || 'NO_CODE', e.message);
              process.exit(1);
            });
          "
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [wait-for-deployments, seed]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run RLS integration tests
        # Estos archivos necesitan una DB real: el mecanismo que cubren (RLS y
        # SECURITY DEFINER) vive en PostgreSQL. En el job `build` corren con una
        # URL dummy y se saltean, asi que este paso es su unica cobertura real.
        # Un archivo nuevo que dependa de la DB tiene que agregarse aca: en
        # `build` pasaria verde sin ejecutar nada.
        run: >-
          pnpm vitest run
          packages/db/src/__tests__/rls-cross-tenant.test.ts
          packages/db/src/__tests__/preapproval-tenant-resolution.test.ts
        env:
          DATABASE_APP_URL: ${{ secrets.NEON_DATABASE_APP_URL }}
      - name: Install Playwright Chromium
        # Con `--with-deps`: en el runner self-hosted (AlmaLinux) no se usaba
        # porque Playwright cae al fallback Ubuntu e invoca `apt-get`, que no
        # existe ahi; las libs se instalaban una vez por `dnf`. En
        # `ubuntu-latest` `apt-get` si existe, asi que las deps de sistema se
        # resuelven en el paso en lugar de depender del estado del host.
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const outcome = '${{ needs.e2e.result }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            if (!context.issue.number) {
              console.log(`No PR context (${context.event}): outcome ${outcome} — skipping PR comment`);
              return;
            }
            const body = outcome === 'success'
              ? `✅ **E2E Tests passed** — [View run](${runUrl})`
              : `❌ **E2E Tests failed** — [View run](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('E2E Tests'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  e2e-success:
    if: always()
    needs: [wait-for-deployments, seed, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check all e2e jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Some e2e jobs failed"
            exit 1
          fi
          echo "All e2e jobs passed or skipped"
