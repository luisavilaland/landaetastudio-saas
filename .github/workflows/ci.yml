name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Create .env.local for build
        run: |
          echo "AUTH_SECRET=dummy-for-build-min-32-chars-long-enough" >> .env.local
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env.local
          echo "DATABASE_APP_URL=postgresql://dummy:dummy@localhost:5432/dummy" >> .env.local
          echo "MERCADOPAGO_ACCESS_TOKEN=dummy" >> .env.local

      - run: pnpm build

      - run: pnpm test
