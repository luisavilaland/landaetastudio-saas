name: "Bug report"
description: "Reportar un comportamiento inesperado"
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del bug
      description: Explicá qué pasa de forma clara y concisa
      placeholder: "Al hacer click en X, la app muestra Y en lugar de Z..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería pasar
      placeholder: "Debería mostrar Z y navegar a la página W..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Pasos mínimos para reproducir el bug
      placeholder: |
        1. Ir a /pagina
        2. Click en botón X
        3. Observar error Y
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / Versión
      description: Commit hash, tag o branch donde ocurre (opcional)
      placeholder: "ej: 74d79d6 o v0.10.0"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Screenshots, logs, browser, tenant afectado, etc. (opcional)
      placeholder: "Adjuntar captura, log de consola, user agent..."
    validations:
      required: false